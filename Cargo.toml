[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/tools",
    "crates/query",
    "crates/tui",
    "crates/commands",
    "crates/mcp",
    "crates/gateway",
    "crates/acp",
    "crates/envs",
    "crates/web",
    "crates/plugins",
    "crates/cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls", "multipart"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
clap_complete = "4"
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
inventory = "0.3"
futures = "0.3"
async-trait = "0.1"
url = "2"
regex = "1"
glob = "0.3"
walkdir = "2"
toml = "0.8"
dotenvy = "0.15"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
parking_lot = "0.12"
sha2 = "0.10"
base64 = "0.22"
once_cell = "1"
