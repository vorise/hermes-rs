[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/api",
    "crates/tools",
    "crates/query",
    "crates/tui",
    "crates/commands",
    "crates/mcp",
    "crates/gateway",
    "crates/acp",
    "crates/envs",
    "crates/web",
    "crates/plugins",
    "crates/cli",
]

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
reqwest = { version = "0.12", features = ["json", "stream", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
async-openai = "0.27"
inventory = "0.3"
futures = "0.3"
async-trait = "0.1"
url = "2"
regex = "1"
glob = "0.3"
walkdir = "2"
toml = "0.8"
dotenvy = "0.15"
dirs = "6"
once_cell = "1"
parking_lot = "0.12"
bytes = "1"
pin-project-lite = "0.2"
tokio-stream = "0.1"
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
hyper = "1"
http = "1"
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
authors = ["Hermes-RS Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/nousresearch/hermes-rs"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true